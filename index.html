<!DOCTYPE html><html lang="ms"><head><meta name="ms-sp-authoring-source" content="agent"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Kids Adventure Tahun 1-3</title><style>
:root{--b:#75cdf5;--g:#91e4b7;--y:#ffe47a;--p:#ffb4c8;--i:#29485c;--r:#ed7070}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;font-family:Trebuchet MS,Arial,sans-serif;color:var(--i);background:linear-gradient(145deg,#bceaff,#def8e8 60%,#fff0a8)}button{font:inherit}.app{max-width:1050px;min-height:calc(100vh - 32px);margin:auto;background:#fffdf6;border:5px solid #fff;border-radius:30px;overflow:hidden;box-shadow:0 18px 35px #315b7030}header{padding:15px 20px;background:linear-gradient(110deg,var(--b),var(--g));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;color:#fff;font-size:clamp(1.35rem,4vw,2.35rem);text-shadow:0 3px #3494bb}.brand p{margin:4px 0;font-weight:900}.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.chip{background:#fff;border:3px solid var(--y);border-radius:17px;padding:7px 10px;font-weight:900;white-space:nowrap}.view{display:none;padding:clamp(18px,4vw,35px);text-align:center}.active{display:block}.years,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.year,.card{border:0;border-radius:24px;padding:18px 12px;min-height:145px;cursor:pointer;color:var(--i);box-shadow:0 8px #386d7b26}.year:nth-child(1),.card:nth-child(3n+1){background:#c9efff}.year:nth-child(2),.card:nth-child(3n+2){background:#c9f2d9}.year:nth-child(3),.card:nth-child(3n){background:#fff0a5}.icon{display:block;font-size:3rem}.year strong,.card strong{display:block;font-size:1.2rem;margin:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.back,.primary{border:0;border-radius:17px;padding:11px 17px;font-weight:900;cursor:pointer}.back{background:#deeffa;box-shadow:0 5px #add5e4}.timer{height:14px;background:#dceff4;border-radius:99px;overflow:hidden;max-width:700px;margin:0 auto 17px}.fill{height:100%;background:linear-gradient(90deg,#6fd8a7,#ffe16d,#ff8888);transition:width 1s}.arena{min-height:310px;display:grid;place-items:center;background:#fff;border:4px solid #d9eff7;border-radius:28px;padding:24px;box-shadow:0 9px #cbe4ed}.prompt{font-size:clamp(1.15rem,3.5vw,1.7rem);font-weight:900}.equation{font-size:clamp(2.7rem,9vw,5rem);font-weight:1000;color:#24739b}.objects{font-size:clamp(2.4rem,8vw,4rem);max-width:750px}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;max-width:800px;margin:20px auto}.answer{border:0;border-radius:20px;min-height:72px;padding:12px;background:var(--y);box-shadow:0 7px #dfba43;font-size:clamp(1.4rem,5vw,2.1rem);font-weight:900;cursor:pointer}.answer:nth-child(even){background:#baeacf;box-shadow:0 7px #69b88e}.feedback{min-height:42px;font-size:1.4rem;font-weight:900}.good{color:#309c6c}.bad{color:var(--r)}.medal{font-size:5rem}.burst{position:fixed;z-index:10;pointer-events:none;font-size:2rem;animation:burst .9s forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0}}@media(max-width:720px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}.grid,.years{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:repeat(2,1fr)}.stats{max-width:155px}.chip{font-size:.8rem}}@media(max-width:450px){.grid,.years{grid-template-columns:1fr}.brand p{display:none}}
</style></head><body><div class="app"><header><div class="brand"><h1>🎮 Math Kids Adventure</h1><p>Tahun 1 hingga Tahun 3</p></div><div class="stats"><span class="chip">⭐ <span id="score">0</span></span><span class="chip">❤️ <span id="lives">3</span></span><span class="chip">⏱️ <span id="time">90</span>s</span><span class="chip">🏆 <span id="high">0</span></span></div></header>
<section id="years" class="view active"><h2>Pilih Tahun</h2><div class="years"><button class="year" data-year="1"><span class="icon">🌱</span><strong>Tahun 1</strong><small>Nombor, tambah dan tolak mudah</small></button><button class="year" data-year="2"><span class="icon">🌿</span><strong>Tahun 2</strong><small>Operasi hingga dua digit</small></button><button class="year" data-year="3"><span class="icon">🌳</span><strong>Tahun 3</strong><small>Darab, bahagi dan operasi campuran</small></button></div></section>
<section id="menu" class="view"><div class="top"><button id="change" class="back">← Tukar Tahun</button><h2 id="yearTitle"></h2><span></span></div><div class="grid"><button class="card" data-game="count"><span class="icon">🍎</span><strong>Kira Objek</strong></button><button class="card" data-game="add"><span class="icon">➕</span><strong>Tambah</strong></button><button class="card" data-game="subtract"><span class="icon">➖</span><strong>Tolak</strong></button><button class="card" data-game="multiply"><span class="icon">✖️</span><strong>Darab</strong></button><button class="card" data-game="divide"><span class="icon">➗</span><strong>Bahagi</strong></button><button class="card" data-game="missing"><span class="icon">🔢</span><strong>Nombor Hilang</strong></button><button class="card" data-game="boss"><span class="icon">👑</span><strong>Boss Challenge</strong></button></div></section>
<section id="play" class="view"><div class="top"><button id="back" class="back">← Menu</button><h2 id="title"></h2><span class="chip">Soalan <span id="round">1</span>/10</span></div><div class="timer"><div id="fill" class="fill"></div></div><div id="arena" class="arena"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div></section>
<section id="result" class="view"><div id="medal" class="medal">🏅</div><h2 id="resultTitle">Tahniah!</h2><p id="resultText"></p><button id="again" class="back">Main Lagi</button><button id="home" class="back">Pilih Game</button></section></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),views=[...document.querySelectorAll('.view')],arena=$('#arena'),answers=$('#answers'),feedback=$('#feedback'),shuffle=a=>[...a].sort(()=>Math.random()-.5),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const titles={count:'🍎 Kira Objek',add:'➕ Tambah',subtract:'➖ Tolak',multiply:'✖️ Darab',divide:'➗ Bahagi',missing:'🔢 Nombor Hilang',boss:'👑 Boss Challenge'};let year=1,game='',score=0,lives=3,time=90,round=1,correct=0,locked=false,tick,pool=[],current;let high=readHigh();function readHigh(){try{return +(window.localStorage.getItem('mathKidsYearHigh')||0)}catch(e){return 0}}function saveHigh(value){try{window.localStorage.setItem('mathKidsYearHigh',value)}catch(e){}}$('#high').textContent=high;function show(id){views.forEach(v=>v.classList.remove('active'));$(id).classList.add('active')}function update(){$('#score').textContent=score;$('#lives').textContent=lives;$('#time').textContent=time;$('#round').textContent=Math.min(round,10);$('#fill').style.width=(time/90*100)+'%';if(score>high){high=score;saveHigh(high);$('#high').textContent=high}}function tone(f,d=.14,delay=0){try{let A=window.AudioContext||window.webkitAudioContext,c=new A,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d)}catch(e){}}function stars(){for(let i=0;i<12;i++){let s=document.createElement('span');s.className='burst';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='55%';let a=Math.PI*2*i/12,d=rand(70,180);s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}function choices(ans,max){let o=[ans];while(o.length<4){let x=Math.max(0,Math.min(max,ans+rand(-8,8)));if(!o.includes(x))o.push(x)}return shuffle(o)}function buttons(ans,max=100){answers.innerHTML='';choices(ans,max).forEach(x=>{let b=document.createElement('button');b.className='answer';b.textContent=x;b.onclick=()=>pick(x,ans,b);answers.appendChild(b)})}function pick(x,ans,b){if(locked)return;if(x===ans){locked=true;score+=10;correct++;feedback.textContent='Betul! Hebat! 🎉';feedback.className='feedback good';b.style.background='#70dfa8';tone(530);tone(710,.18,.14);stars();update();setTimeout(next,850)}else{lives--;feedback.textContent='Cuba lagi!';feedback.className='feedback bad';tone(230,.2);update();if(lives<=0)setTimeout(end,400)}}function makePool(type){let p=[],seen=new Set;while(p.length<30){let q=makeQuestion(type),key=q.text+'|'+q.ans;if(!seen.has(key)){seen.add(key);p.push(q)}}return shuffle(p)}function makeQuestion(type){let max=year===1?10:year===2?50:100,a,b,ans,text,html;if(type==='count'){ans=rand(1,year===1?10:year===2?15:20);text='Kira objek';html=`<p class="prompt">Kira semua objek</p><div class="objects">${'🍎 '.repeat(ans)}</div>`}else if(type==='add'){a=rand(1,max);b=rand(1,max);ans=a+b;text=`${a}+${b}`;html=`<p class="prompt">Berapakah jumlahnya?</p><div class="equation">${a} + ${b} = ?</div>`}else if(type==='subtract'){a=rand(2,max);b=rand(1,a);ans=a-b;text=`${a}-${b}`;html=`<p class="prompt">Berapakah bezanya?</p><div class="equation">${a} − ${b} = ?</div>`}else if(type==='multiply'){a=rand(1,year===1?5:year===2?10:12);b=rand(1,year===1?5:year===2?10:12);ans=a*b;text=`${a}x${b}`;html=`<p class="prompt">Hitung darab</p><div class="equation">${a} × ${b} = ?</div>`}else if(type==='divide'){b=rand(1,year===1?5:year===2?10:12);ans=rand(1,year===1?5:year===2?10:12);a=b*ans;text=`${a}/${b}`;html=`<p class="prompt">Hitung bahagi</p><div class="equation">${a} ÷ ${b} = ?</div>`}else{let start=rand(1,max),gap=year===1?1:rand(1,year===2?5:10),pos=rand(1,3),seq=[];ans=start+gap*pos;for(let i=0;i<5;i++)seq.push(i===pos?'?':start+gap*i);text=seq.join(',');html=`<p class="prompt">Cari nombor yang hilang</p><div class="equation">${seq.join(' , ')}</div>`}return{ans,text,html,max:Math.max(100,ans+15)}}function start(g){game=g;score=0;lives=3;time=90;round=1;correct=0;locked=false;let type=g==='boss'?'boss':g;pool=type==='boss'?shuffle(['add','subtract','multiply','divide','missing','count'].flatMap(x=>makePool(x).slice(0,5))):makePool(type);$('#title').textContent=titles[g];feedback.textContent='';show('#play');clearInterval(tick);tick=setInterval(()=>{time--;update();if(time<=0)end()},1000);update();question()}function next(){if(lives<=0||time<=0)return end();if(++round>10)return end();locked=false;feedback.textContent='';question()}function question(){current=pool.shift();arena.innerHTML='<div>'+current.html+'</div>';buttons(current.ans,current.max)}function end(){clearInterval(tick);locked=true;$('#medal').textContent=score>=80?'🥇':score>=50?'🥈':'🥉';$('#resultTitle').textContent=lives<=0?'Jangan putus asa!':'Tahniah!';$('#resultText').innerHTML=`Tahun ${year}<br>Skor: <b>${score}</b><br>Betul: <b>${correct}</b>/10<br>High score: <b>${high}</b>`;show('#result');update()}document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{year=+b.dataset.year;$('#yearTitle').textContent='Tahun '+year;show('#menu')});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));$('#change').onclick=()=>show('#years');$('#back').onclick=()=>{clearInterval(tick);show('#menu')};$('#home').onclick=()=>show('#menu');$('#again').onclick=()=>start(game);update()})();
</script></body></html>
